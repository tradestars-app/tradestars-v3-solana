[package]
name = "tradestars-arena"
version = "0.1.0"
description = "TradeStars Arena - Entry vault and payout settlement for weekly competitions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tradestars_arena"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
